[General]
; Read a loose file's remaining bytes in one go when the game asks for its first 64 KB piece,
; and hand the game the next pieces from memory. 0 = the game reads 64 KB at a time as before.
bWholeFileReads=1

; Let loose files go through the Windows file cache, so a file read once is in memory the next time.
; 0 = the game's own setting (no Windows cache).
bWindowsFileCache=1

; Which loose files this applies to, by extension, separated by commas: textures, meshes, materials.
; Leave out sound and voice files (xwm, wav, fuz): the game plays them piece by piece, a whole read would be wasted.
sExtensions=dds,nif,bgsm,bgem

; Write running totals to My Games\Fallout4\F4SE\FasterLooseFiles.log every 2 seconds.
bEnableLogging=0

[Debug]
; Read every piece handed to the game a second time the game's own way and compare the bytes.
; Slow: for testing only.
bVerifyReads=0

; How often bEnableLogging writes the running totals, in milliseconds.
iStatsIntervalMs=2000

; The largest single whole-file read, in KB (128 to 4096).
iMaxReadKB=1024
